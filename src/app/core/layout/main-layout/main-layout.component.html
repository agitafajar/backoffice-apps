<!-- Mobile overlay -->
    @if (sidebarOpen()) {
      <div
        class="sidebar-overlay lg:hidden"
        (click)="sidebarOpen.set(false)"
      ></div>
    }

    <!-- Sidebar -->
    <div
      class="sidebar-wrapper"
      [class.sidebar-wrapper--open]="sidebarOpen()"
    >
      <app-sidebar />
    </div>

    <!-- Main content area -->
    <div class="main-content">
      <app-topbar (menuToggle)="toggleSidebar()" />
      <main class="main-content__body">
        <router-outlet />
      </main>
    </div>
