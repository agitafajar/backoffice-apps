<header class="topbar">
  <div class="topbar__left">
    <button
      mat-icon-button
      class="topbar__menu-btn lg:hidden"
      (click)="menuToggle.emit()"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <h1 class="topbar__title">Employee Management</h1>
  </div>

  <div class="topbar__right">
    <div class="topbar__search">
      <mat-icon class="topbar__search-icon">search</mat-icon>
      <input
        type="text"
        class="topbar__search-input"
        placeholder="Search employees, reports..."
        [(ngModel)]="searchQuery"
      />
    </div>

    <!-- Notifications with badge -->
    <div class="topbar__notification-wrapper">
      <button mat-icon-button class="topbar__action topbar__notification-btn">
        <mat-icon>notifications_none</mat-icon>
      </button>
      <span class="topbar__badge">2</span>
    </div>

    <!-- Help / Question mark -->
    <button mat-icon-button class="topbar__action">
      <mat-icon>help_outline</mat-icon>
    </button>

    <!-- User Profile Dropdown -->
    <div class="topbar__user" [matMenuTriggerFor]="userMenu">
      <div class="topbar__avatar-circle">
        AD
      </div>
      <span class="topbar__user-name">Admin</span>
      <mat-icon class="topbar__user-arrow">expand_more</mat-icon>
      
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item>
          <mat-icon>account_circle</mat-icon>
          <span>My Profile</span>
        </button>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="logout()" class="text-error">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </div>
  </div>
</header>
